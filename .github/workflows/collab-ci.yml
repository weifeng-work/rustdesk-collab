name: Collab CI (Windows)

# 只为本项目的协作模式改动服务：做一次真实的 Windows 编译验证。
# 上游 ci.yml 只跑 Linux，flutter-build.yml 需要 Flutter SDK + bridge codegen，
# 两者都不适合「先验证 Rust 侧能不能编过」这个目标。

on:
  workflow_dispatch:
  push:
    branches:
      - collab-m1
      - collab
      - master

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # 与上游 ci.yml / vcpkg.json 的 baseline 保持一致
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  check-windows:
    name: build (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout (with hbb_common submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show versions
        shell: bash
        run: |
          rustc -V
          cargo -V
          cmake --version | head -1

      - name: Locate libclang
        shell: bash
        run: |
          for d in "/c/Program Files/LLVM/bin" "/c/Program Files (x86)/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin"; do
            if [ -f "$d/libclang.dll" ]; then
              echo "LIBCLANG_PATH=$d" >> "$GITHUB_ENV"
              echo "found libclang in $d"
              break
            fi
          done
          echo "LIBCLANG_PATH=${LIBCLANG_PATH:-(unset)}"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - uses: Swatinem/rust-cache@v2

      - name: Generate inlined UI resources
        shell: bash
        # Sciter UI 必须带 inline 特性。src/ui.rs:178 在未开 inline 时会去读
        # <cwd>/src/ui/index.html，产物一旦离开源码树就是白屏。
        # src/ui/inline.rs 由该脚本生成，且被 .gitignore:8 忽略。
        run: |
          python res/inline-sciter.py
          ls -l src/ui/inline.rs

      - name: cargo build (release)
        shell: bash
        run: |
          cargo build --release --locked --features inline 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Fetch sciter runtime
        shell: pwsh
        run: |
          # Sciter UI 版是运行时动态加载 sciter.dll 的（src/ui.rs:63），仓库不附带。
          # 官方说明见 docs/README.md：需自行下载 https://sciter.com/ 的动态库。
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll" -OutFile sciter.dll
          Get-Item sciter.dll | Format-Table Name, Length

      - name: Package artifact
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target/release/rustdesk.exe out/
          Copy-Item sciter.dll out/
          Get-ChildItem out | Format-Table Name, Length
          Compress-Archive -Path out/* -DestinationPath rustdesk-collab-m1-windows-x64.zip -Force

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-collab-m1-windows-x64
          path: rustdesk-collab-m1-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-log
          path: build.log
          if-no-files-found: ignore
